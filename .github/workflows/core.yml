name: Core

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Android 16 LSPlant Patches
        run: |
          git -C external/lsplant apply ../../patches/lsplant_android16.patch

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='key.jks' >> gradle.properties
            echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Gradle properties
        run: |
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: 1.12.1

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'
      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew zipAll

      - name: Prepare artifact
        if: success()
        id: prepareArtifact
        run: |
          zygiskReleaseName=`ls zygisk/release/Vector-v*-Release.zip | awk -F '(/|.zip)' '{print $3}'` && echo "zygiskReleaseName=$zygiskReleaseName" >> $GITHUB_OUTPUT
          zygiskDebugName=`ls zygisk/release/Vector-v*-Debug.zip | awk -F '(/|.zip)' '{print $3}'` && echo "zygiskDebugName=$zygiskDebugName" >> $GITHUB_OUTPUT
          unzip zygisk/release/Vector-v*-Release.zip -d Vector-Release
          unzip zygisk/release/Vector-v*-Debug.zip -d Vector-Debug

      - name: Upload zygisk release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.zygiskReleaseName }}
          path: "./Vector-Release/*"

      - name: Upload zygisk debug
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.zygiskDebugName }}
          path: "./Vector-Debug/*"

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: mappings
          path: |
            zygisk/build/outputs/mapping
            app/build/outputs/mapping

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols
          path: build/symbols

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release_assets
          cp zygisk/release/Vector-v*-Release.zip release_assets/
          cp zygisk/release/Vector-v*-Debug.zip release_assets/

          python3 -c "
          import sys
          tag = '$TAG_NAME'
          try:
              with open('zygisk/changelog.md', 'r') as f:
                  content = f.read()
              start = content.find('🚀 **What\'s New in ' + tag)
              if start != -1:
                  first_dash = content.find('---', start)
                  if first_dash != -1:
                      next_dash = content.find('---', first_dash + 3)
                      body = content[start:next_dash if next_dash != -1 else len(content)].strip()
                  else:
                      body = content[start:].strip()
                  with open('release_notes.md', 'w') as out:
                      out.write(body)
              else:
                  with open('release_notes.md', 'w') as out:
                      out.write(f'Vector-X {tag}')
          except Exception:
              with open('release_notes.md', 'w') as out:
                  out.write(f'Vector-X {tag}')
          "

          gh release create "$TAG_NAME" release_assets/* \
            --title "Vector-X $TAG_NAME" \
            --notes-file release_notes.md

